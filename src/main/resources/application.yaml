server:
  servlet:
    context-path: /portal-atendimento

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    cookie-secure: ${COOKIE_SECURE:false}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/portal_mensagens}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: portal-mensagens
