server:
  servlet:
    context-path: /portal-mensagens

app:
  jwt:
    secret: ${JWT_SECRET:minha_super_chave_secreta_que_ninguem_sabe}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
  gupshup:
    base-url: ${GUPSHUP_BASE_URL:https://api.gupshup.io}
    api-key: ${GUPSHUP_API_KEY:}
    app-name: ${GUPSHUP_APP_NAME:}
    source-number: ${GUPSHUP_SOURCE_NUMBER:}
    webhook-token: ${GUPSHUP_WEBHOOK_TOKEN:}
  billing:
    base-url: ${BILLING_BASE_URL:}
    copy-id: ${BILLING_COPY_ID:}
    cnpj: ${BILLING_CNPJ:}
    password: ${BILLING_PASSWORD:}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/portal_mensagens}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: portal-mensagens
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s

oracle:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST}:1521/${ORACLE_SERVICE}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    hikari:
      pool-name: oracle-pool
      maximum-pool-size: 3          # pouco tráfego, não ocupe conexões do sistema deles
      read-only: true
      connection-timeout: 10000